services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: margin
      POSTGRES_PASSWORD: margin
      POSTGRES_DB: margin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U margin -d margin']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
